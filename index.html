  <style>
    :root{--ink:#171921;--muted:#6d7280;--line:#e6e8ed;--soft:#f4f6f9;--blue:#087df5;--green:#20bf67}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

    html.external body{visibility:hidden}html.in-app body{visibility:visible}html.external .corner-cue{display:none}
    .shell{width:min(100%,430px);min-height:100vh;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 17px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#fff 0%,#fafbfc 100%);box-shadow:0 0 45px rgba(24,32,48,.1)}

    .detected{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:#585d68;font-size:10px;font-weight:850;text-transform:uppercase}.detected::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
    .hero{text-align:center;padding:20px 6px 14px}.browser-logo{display:block;width:42px;height:42px;margin:0 auto 11px;filter:drop-shadow(0 6px 10px rgba(27,34,48,.16))}
    h1{margin:0;font-size:24px;line-height:1.15;font-weight:850;letter-spacing:-.55px}.subtitle{margin:8px auto 0;color:var(--muted);font-size:13px;line-height:1.4}
    .demo{position:relative;width:100%;aspect-ratio:1/1;border:1px solid #d9dde5;border-radius:21px;overflow:hidden;background:#fff;box-shadow:0 13px 32px rgba(24,32,48,.13)}.demo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
    .live{position:absolute;left:11px;top:11px;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(18,20,25,.78);color:#fff;font-size:9.5px;font-weight:850;backdrop-filter:blur(8px)}.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#31db7d;box-shadow:0 0 0 3px rgba(49,219,125,.18)}
    .gif-fallback{display:none;width:100%;height:100%;place-items:center;text-align:center;background:linear-gradient(145deg,#f8faff,#edf3fb)}.gif-fallback.show{display:grid}.fallback-arrow{font-size:45px;line-height:1;color:var(--blue);animation:nudge 1s ease-in-out infinite}.fallback-menu{font-size:41px;font-weight:900;letter-spacing:4px}.gif-fallback strong{display:block;margin-top:7px;font-size:13px}
    .corner-cue{position:fixed;z-index:20;right:max(13px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));display:flex;align-items:center;gap:5px;pointer-events:none;filter:drop-shadow(0 3px 8px rgba(20,25,35,.24));animation:nudge 1s ease-in-out infinite}.corner-cue span{padding:7px 9px;border-radius:999px;background:#161921;color:#fff;font-size:9px;font-weight:900;white-space:nowrap}.corner-cue svg{width:32px;height:32px;fill:none;stroke:#161921;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-16deg)}
    @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .steps{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.step{min-height:71px;display:flex;align-items:center;gap:9px;padding:11px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 4px 13px rgba(24,32,48,.04)}.number{flex:0 0 29px;width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:12px;font-weight:850}.step strong{display:block;font-size:12px;line-height:1.22}.step span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.2}
    .waiting{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:12px;border:1px solid #d8eaff;border-radius:14px;background:#eff7ff;color:#0872df;font-size:11.5px;font-weight:750}.spinner{width:15px;height:15px;border:2px solid #b9d9ff;border-top-color:var(--blue);border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .redirect-fallback{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:28px;text-align:center;background:#fff}.redirect-fallback a{display:inline-block;margin-top:15px;padding:13px 22px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}
    @media(max-width:350px){.shell{padding-left:12px;padding-right:12px}.steps{grid-template-columns:1fr}.hero{padding-top:16px}.demo{border-radius:17px}}
    @media(prefers-reduced-motion:reduce){.spinner,.corner-cue,.fallback-arrow{animation:none}}
  </style>
